name: jaffle_shop
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"
  # Removed "dbt_internal_packages" from clean-targets to avoid errors related to missing files

models:
  jaffle_shop:
    staging:
      +materialized: view
    marts:
      +materialized: table

    
